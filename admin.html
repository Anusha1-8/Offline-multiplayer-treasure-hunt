
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #100044;
      color: white;
      font-family: "Courier New", monospace;
    }
    .login {
      width: min(90%, 360px);
      padding: 30px;
      border: 2px solid #d98cff;
      text-align: center;
      background: #200854;
    }
    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 15px 0;
    }
    button {
      padding: 12px 20px;
      background: #7800e8;
      color: white;
      border: 2px solid #e8b5ff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="login">
    <h1>ADMIN LOGIN</h1>
    <form id="loginForm">
      <input id="username" placeholder="Username" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">LOGIN</button>
    </form>
    <p id="message" aria-live="polite"></p>
    <button onclick="location.href='index.html'">HOME</button>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("message").textContent =
        "Login page is connected. Add secure authentication to enable admin access.";
    });
  </script>
</body>
</html>
